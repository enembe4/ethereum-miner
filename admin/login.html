<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login — Etay Exteriors</title>
<link rel="stylesheet" href="/css/site.css">
</head>
<body style="background:var(--wash-2);">
<div style="min-height:100vh;display:grid;place-items:center;padding:24px;">
  <div class="card card--pad-lg" style="width:100%;max-width:380px;">
    <div class="logo" style="justify-content:center;margin-bottom:6px;">Admin</div>
    <p class="center muted" style="margin-bottom:20px;">Pipeline &amp; reviews · staff only</p>
    <form id="loginForm">
      <div class="field"><label>Username</label><input class="input" id="u" autocomplete="username" value=""></div>
      <div class="field"><label>Password</label><input class="input" id="p" type="password" autocomplete="current-password"></div>
      <div id="err" class="tag tag--bad" style="display:none;margin-bottom:12px;"></div>
      <button class="btn btn--block btn--lg" type="submit">Sign in</button>
    </form>
    <p class="center" style="margin-top:16px;"><a href="/" style="font-size:.85rem;">← Back to website</a></p>
  </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e){
  e.preventDefault();
  var err = document.getElementById('err'); err.style.display='none';
  var r = await fetch('/admin/login', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({username: document.getElementById('u').value, password: document.getElementById('p').value})});
  if (r.ok) { location.href = '/admin/index.html'; }
  else { var d = await r.json().catch(()=>({})); err.textContent = d.error || 'Login failed'; err.style.display='inline-block'; }
});
</script>
</body>
</html>
