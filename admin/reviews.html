<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · Reviews — Nassau Painting Co.</title>
<link rel="stylesheet" href="/css/site.css">
</head>
<body>
<div class="admin-shell">
  <aside class="admin-side">
    <div class="logo">Admin</div>
    <nav class="admin-nav">
      <a href="/admin/index.html">Pipeline</a>
      <a href="/admin/reviews.html" class="is-active">Reviews</a>
      <a href="#" onclick="Admin.logout();return false;">Sign out</a>
      <a href="/testimonials.html" target="_blank">Public reviews page</a>
    </nav>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Reviews</h1>
      <span style="flex:1;"></span>
      <div class="chips" id="tabs">
        <span class="chip is-on" data-status="pending">Pending</span>
        <span class="chip" data-status="published">Published</span>
        <span class="chip" data-status="rejected">Rejected</span>
      </div>
    </div>
    <div class="note"><strong>Nothing goes live without you.</strong> Every submission lands in <em>Pending</em>. Approve to publish, reply publicly, or reject.</div>
    <div id="list"><p class="muted">Loading…</p></div>
  </main>
</div>

<script src="/js/admin-common.js"></script>
<script src="/js/admin-reviews.js"></script>
</body>
</html>
